name: Cloud server

# Tests of the Tisma Cloud server (proprietary, Python) on SQLite and PostgreSQL, and its program tisma-cloud.

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tisma
          POSTGRES_PASSWORD: tisma
          POSTGRES_DB: tisma_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tisma" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the upgrade drill installs an older commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ".[master,test]"
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          TISMA_TEST_DATABASE_URL: postgresql+psycopg://tisma:tisma@localhost:5432/tisma_test
        run: pytest -q
      # The real master under load (deploy/loadtest.py): 100 users sending and polling, 8 simulated nodes. Every job
      # must end done, with no error of the server.
      # Upgrade drill (deploy/upgrade_drill.py): the version of 2026-10-24 (the first with the service commands) with
      # accounts, jobs and a node, then this one on the same database: SQLite and PostgreSQL.
      - name: Upgrade drill (SQLite and PostgreSQL)
        run: |
          set -e
          git config --global user.email ci@tisma.test && git config --global user.name ci
          python deploy/upgrade_drill.py --old-ref a7a9805 --users 20 --folder "$RUNNER_TEMP/upgrade-sqlite"
          python deploy/upgrade_drill.py --old-ref a7a9805 --users 20 --folder "$RUNNER_TEMP/upgrade-pg" \
            --database-url postgresql+psycopg://tisma:tisma@localhost:5432/tisma_test
      - name: Load test (PostgreSQL)
        env:
          TISMA_DATABASE_URL: postgresql+psycopg://tisma:tisma@localhost:5432/tisma_test
          TISMA_STORAGE_DIR: ./load-storage
          TISMA_UPDATES_URL: ""
          TISMA_BACKUP_DIR: "off"
        run: |
          set -e
          tisma-cloud master --port 18980 > load-master.log 2>&1 &
          master=$!
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:18980/v1/health > /dev/null 2>&1 && break; sleep 1; done
          python deploy/loadtest.py --url http://127.0.0.1:18980 --users 100 --jobs 5 --nodes 8 | tee load-report.json
          # Scans in pieces at the same time as slicing jobs (other accounts, the same master and nodes).
          python deploy/loadtest.py --url http://127.0.0.1:18980 --users 30 --jobs 2 --nodes 8 --scans 1 --scan-mb 24 \
            --prefix escaneo | tee load-scan-report.json
          kill $master || true
          if grep -i "traceback" load-master.log; then exit 1; fi

  # tisma-relay, the relay of the library (relay/, Go and go-libp2p): its tests with real libp2p peers.
  relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Build and test
        working-directory: relay
        run: |
          go vet ./...
          go test -count=1 ./...
          go build -o tisma-relay .
      # The program for the package of tisma-cloud (dist/tisma-relay/), for Windows and Linux: pure Go, no cgo.
      - name: Build for the package
        working-directory: relay
        env:
          CGO_ENABLED: "0"
        run: |
          set -e
          mkdir -p out/windows out/linux
          GOOS=windows GOARCH=amd64 go build -trimpath -o out/windows/tisma-relay.exe .
          GOOS=linux GOARCH=amd64 go build -trimpath -o out/linux/tisma-relay .
          ls -la out/windows out/linux
      - uses: actions/upload-artifact@v4
        with:
          name: tisma-relay-windows
          path: relay/out/windows
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: tisma-relay-linux
          path: relay/out/linux
          retention-days: 7
      # The seeder's virus check with the real ClamAV (a program apart, GPL: called, never linked) and its signatures:
      # the EICAR test file alone and inside a 3MF, a clean 3MF, and the whole seeder with an infected model. When
      # freshclam cannot download the official signatures (database.clamav.net limits the downloads), a signature of
      # EICAR in ClamAV's own format (.ndb) stands in, with a warning: the program is still the real one.
      - name: Real ClamAV
        working-directory: relay
        run: |
          set -e
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q clamav > /dev/null
          clamscan --version
          sudo systemctl stop clamav-freshclam || true
          if ! sudo freshclam --stdout; then
            echo "::warning::freshclam could not download the signatures: a test signature of EICAR instead"
            echo 'TismaTest.EICAR:0:*:58354f2150254041505b345c505a58353428505e2937434329377d2445494341522d5354414e444152442d414e544956495255532d544553542d46494c452124482b482a' \
              | sudo tee /var/lib/clamav/tisma-test.ndb > /dev/null
          fi
          ls -la /var/lib/clamav
          TISMA_CLAMSCAN=clamscan go test -count=1 -v -run 'TestTheRealClamAV|TestTheSeederKeepsChecksAndAnnouncesTheLibrary' . | tee clam.log
          grep -q -- "--- PASS: TestTheRealClamAV" clam.log
          grep -q -- "--- PASS: TestTheSeederKeepsChecksAndAnnouncesTheLibrary" clam.log

  # The server as one program, tisma-cloud (.exe on Windows): master, node and administration (tisma-cloud.spec).
  executable:
    needs: [tests, relay]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows
            exe: tisma-cloud.exe
          - os: ubuntu-24.04
            name: linux
            exe: tisma-cloud
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ".[master,exe]"
      - name: Build
        run: pyinstaller --noconfirm --clean tisma-cloud.spec
      # tisma-engine, the only program a node computes with (Tisma Slicer was left, the owner, 2026-11-11), comes with
      # the package in tisma-engine/ next to the executable: the last nightly of its public repository (a rolling pre-release, tag nightly). PolyForm Noncommercial 1.0.0 with commercial use
      # reserved to its owner, who is the owner of Tisma Cloud; the package runs only on the owner's machines.
      - name: tisma-engine (its nightly)
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_REPO: adriangrochi-code/tisma_engine
        run: |
          set -e
          rm -rf engine-download dist/tisma-engine
          if gh release download nightly -R "$ENGINE_REPO" -p "tisma-engine-nightly-*-${{ matrix.name }}-x64.zip" -D engine-download; then
            gh release view nightly -R "$ENGINE_REPO" --json name,body -q '.name + "\n" + .body' > engine-source.txt
          else
            # No nightly release (publishing it can fail): the newest package of the engine's nightly runs (workflow
            # nightly.yml), an artifact named by its system (linux-x64, windows-x64) that holds the package's zip.
            # A nightly run inside its 20 h window ends well without building one, so the runs are looked through,
            # newest first.
            found_run=""
            for run in $(gh run list -R "$ENGINE_REPO" --workflow nightly.yml --status success --limit 20 \
                         --json databaseId -q '.[].databaseId'); do
              if gh api "repos/$ENGINE_REPO/actions/runs/$run/artifacts" \
                   --jq '.artifacts[] | select(.expired | not) | .name' | grep -qx "${{ matrix.name }}-x64"; then
                found_run=$run; break
              fi
            done
            [ -n "$found_run" ] || { echo "no nightly release and no package of a nightly run of tisma-engine"; exit 1; }
            info=$(gh run view "$found_run" -R "$ENGINE_REPO" --json headSha,createdAt -q '"\(.headSha) \(.createdAt)"')
            echo "::warning::tisma-engine has no nightly release: the package of its nightly run $found_run ($info)"
            gh run download "$found_run" -R "$ENGINE_REPO" -n "${{ matrix.name }}-x64" -D engine-download
            printf 'tisma-engine nightly run %s (commit and date: %s): https://github.com/%s/actions/runs/%s\n' \
              "$found_run" "$info" "$ENGINE_REPO" "$found_run" > engine-source.txt
          fi
          # A zip inside (the release asset, or an artifact holding it) is unpacked; then the folder of the program is
          # taken, wherever it is.
          find engine-download -name '*.zip' -execdir unzip -q -o {} \; -delete
          if [ "${{ matrix.name }}" = windows ]; then name=tisma-engine.exe; else name=tisma-engine; fi
          found=$(find engine-download -type f -name "$name" -printf '%d %p\n' | sort -n | head -n 1 | cut -d' ' -f2-)
          [ -n "$found" ] || { echo "no $name in the package"; find engine-download | head -n 50; exit 1; }
          mv "$(dirname "$found")" dist/tisma-engine
          mv engine-source.txt dist/tisma-engine/SOURCE.txt
          ls dist/tisma-engine
          engine=dist/tisma-engine/$name
          if [ "${{ matrix.name }}" != windows ]; then chmod +x "$engine"; fi
          "$engine" --help | head -n 3
          du -sh dist/tisma-engine
      # The translation tables of the profile pack (the public repository Tisma-profiles-, AGPL-3.0-or-later data), in
      # tisma-profiles/: the engine reads the settings of other slicers' projects with them (--translation-dir). The
      # archive of the latest release is checked against the size and SHA-256 of its index.json; its LICENSE and the
      # exact release go with it (SOURCE.txt).
      - name: Translation tables of the profile pack (its latest release)
        run: |
          pip install httpx > /dev/null
          python deploy/fetch_translation.py --out dist/tisma-profiles
          cat dist/tisma-profiles/SOURCE.txt
      # The library's relay and seeder (the relay job above): run by the service of the master when turned on.
      - uses: actions/download-artifact@v4
        with:
          name: tisma-relay-${{ matrix.name }}
          path: dist/tisma-relay
      - name: tisma-relay in the package
        run: |
          set -e
          ls -la dist/tisma-relay
          if [ "${{ matrix.name }}" = linux ]; then chmod +x dist/tisma-relay/tisma-relay; fi
          export TISMA_HOME="$PWD/relay-home"
          dist/${{ matrix.exe }} role master
          dist/${{ matrix.exe }} config relay on | grep -E '^relay = on'
          dist/${{ matrix.exe }} config TISMA_LIBRARY_PROJECT_KEY abababababababababababababababababababababababababababababababab > /dev/null
          # check answers 1 here (the service is stopped): only the line of the relay is looked at.
          dist/${{ matrix.exe }} check > relay-check.txt || true
          cat relay-check.txt
          grep -E 'Intermediario de la biblioteca: .*tisma-relay[/\\]tisma-relay' relay-check.txt
      - name: Try it
        env:
          TISMA_DATABASE_URL: sqlite:///./try.db
          TISMA_STORAGE_DIR: ./try-storage
          TISMA_INTERNAL_EMAILS: "@tisma.com.uy"
        run: |
          set -e
          # The administration commands work in the folder of the service (that of the executable, dist/), the loose
          # "master" command in the current one: one folder for both, so that they share the SQLite file.
          export TISMA_HOME="$PWD"
          exe=dist/${{ matrix.exe }}
          "$exe" --help
          "$exe" admin plan-set basico --hours 1 --concurrent 1 --public
          token=$("$exe" admin user-add equipo@tisma.com.uy --plan basico | tail -n 1)
          "$exe" admin user-list | grep "unlimited"
          "$exe" master --port 18990 > master.log 2>&1 &
          master=$!
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:18990/v1/health > /dev/null 2>&1 && break; sleep 1; done
          curl -sf -H "Authorization: Bearer $token" http://127.0.0.1:18990/v1/me | grep '"unlimited":true'
          # The smoke test of a deployed master (deploy/smoke.py), here from this machine (--local: /admin answers).
          python deploy/smoke.py --url http://127.0.0.1:18990 --local --token "$token"
          kill $master || true
      - name: Try the service (role, start, status, stop)
        run: |
          set -e
          exe=dist/${{ matrix.exe }}
          export TISMA_HOME=service-home
          "$exe" role master
          "$exe" config port 18991
          "$exe" config TISMA_INTERNAL_EMAILS @tisma.com.uy
          "$exe" start
          "$exe" status
          curl -sf http://127.0.0.1:18991/v1/health
          # The process of "start" has ended and its unpacked files are deleted: the supervisor must still be able to
          # start the master again (it unpacks its own files, PYINSTALLER_RESET_ENVIRONMENT).
          if [ "${{ matrix.name }}" = linux ]; then
            sup=$(cat service-home/tisma-cloud.pid)
            kill -9 "$(ps -o pid=,args= --ppid "$sup" | grep -v -- --local-node | head -n 1 | awk '{print $1}')"
            for _ in $(seq 1 40); do sleep 1; curl -sf http://127.0.0.1:18991/v1/health > /dev/null 2>&1 && break; done
            curl -sf http://127.0.0.1:18991/v1/health || { "$exe" logs 20; exit 1; }
          fi
          "$exe" logs 20
          "$exe" stop
          if "$exe" status; then echo "still running"; exit 1; fi
      # Started from the window (not by the scheduled task), the process that starts the service ends and its unpacked
      # files are deleted: the supervisor must still be able to start the master again.
      - name: Windows (service started by a process that has ended)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path dist/tisma-cloud.exe).Path
          $svc = Join-Path $PWD "restart-home"
          function tc { & $exe --home $svc @args; if ($LASTEXITCODE -ne 0) { throw "tisma-cloud $args failed ($LASTEXITCODE)" } }
          function healthy { try { (Invoke-WebRequest http://127.0.0.1:18993/v1/health -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200 } catch { $false } }
          tc role master
          tc config port 18993
          tc config master_computes off
          tc start
          Start-Sleep 3
          $sup = [int](Get-Content "$svc/tisma-cloud.pid")
          $child = Get-CimInstance Win32_Process -Filter "ParentProcessId=$sup" | Where-Object { $_.CommandLine -notmatch '--local-node' } | Select-Object -First 1
          if (-not $child) { throw "no child of the supervisor $sup" }
          taskkill /PID $child.ProcessId /T /F | Out-Null
          Start-Sleep 2
          $back = $false
          for ($i = 0; $i -lt 40; $i++) { if (healthy) { $back = $true; break }; Start-Sleep 1 }
          tc logs 15
          if (-not $back) { throw "the master was not started again" }
          tc stop
      # The node of the package finds tisma-engine by itself and slices projects of the new Tisma with it.
      - name: Programs of the package
        run: |
          set -e
          if [ "${{ matrix.name }}" = windows ]; then engine=dist/tisma-engine/tisma-engine.exe; else
            engine=dist/tisma-engine/tisma-engine; fi
          export TISMA_HOME="$PWD/package-home"
          dist/${{ matrix.exe }} role node
          dist/${{ matrix.exe }} config | grep -E '^tisma_engine = .*tisma-engine[/\\]'
          dist/${{ matrix.exe }} config | grep -E '^translation_dir = .*tisma-profiles[/\\]translation'
          unset TISMA_HOME
          pip install ".[master,test]" > /dev/null
          TISMA_ENGINE_BIN="$PWD/$engine" pytest -q -s tests/test_node.py -k real_engine_slices_the_new -rs | tee real.log
          grep -q "1 passed" real.log
      # orient, aero and analyze of the engine's nightly against cloud.md (rules 19 to 19c), and a bare model sliced:
      # reported, not blocking the package (a nightly that strays is told to the engine).
      - name: tisma-engine contract of orient, aero and analyze, and a bare model (its nightly)
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = windows ]; then engine=dist/tisma-engine/tisma-engine.exe; else
            engine=dist/tisma-engine/tisma-engine; fi
          TISMA_ENGINE_BIN="$PWD/$engine" pytest -q -s tests/test_node.py -k "real_engine_keeps_the_contract or real_engine_slices_a_bare_model" -rs
      # The beta as it will run (deploy/BETA.md): the packaged master as a service, computing with its own node and the
      # tisma-engine of the package, and deploy/smoke.py from outside the process: health, public plans, the account and
      # a real project sliced by that node, its G-code back.
      - name: Packaged master and its node, smoke test with a real job
        run: |
          set -e
          exe="$PWD/dist/${{ matrix.exe }}"
          export TISMA_HOME="$PWD/smoke-home"
          "$exe" role master
          "$exe" config port 18994
          "$exe" admin plan-set beta --hours 5 --concurrent 2 --classes all --public
          "$exe" admin user-add smoke@tisma.test --plan beta > /dev/null
          "$exe" admin user-set smoke@tisma.test --paid-until 2099-01-01 > /dev/null
          token=$("$exe" admin user-token smoke@tisma.test | grep -o 'tu_[A-Za-z0-9_-]*' | head -n 1)
          "$exe" start
          for _ in $(seq 1 40); do curl -sf http://127.0.0.1:18994/v1/health > /dev/null 2>&1 && break; sleep 1; done
          if ! python deploy/smoke.py --url http://127.0.0.1:18994 --local --token "$token" \
               --project tests/data/box_project.3mf --timeout 900; then
            "$exe" logs 120
            "$exe" stop || true
            exit 1
          fi
          "$exe" stop
      # Restore drill with the program of the package (deploy/restore_drill.py): a master with data, its backup, the
      # same data back on an empty machine with its data.key, and a refusal to start without that key.
      - name: Restore drill
        run: python deploy/restore_drill.py --users 30 --exe "$PWD/dist/${{ matrix.exe }}" --folder restore-drill

      # The runners of GitHub are Windows Server 2022 with an administrator: what a server does at boot.
      - name: Windows Server (start with the machine as SYSTEM, firewall, supervisor)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path dist/tisma-cloud.exe).Path
          $svc = Join-Path $PWD "winsvc-home"
          function tc { & $exe --home $svc @args; if ($LASTEXITCODE -ne 0) { throw "tisma-cloud $args failed ($LASTEXITCODE)" } }
          function healthy { try { (Invoke-WebRequest http://127.0.0.1:18992/v1/health -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200 } catch { $false } }
          tc role master
          tc config port 18992
          tc firewall on
          $port = (Get-NetFirewallRule -DisplayName "Tisma Cloud" | Get-NetFirewallPortFilter).LocalPort
          if ($port -ne "18992") { throw "firewall rule opens $port" }
          tc autostart on
          $xml = schtasks /Query /XML /TN "Tisma Cloud" | Out-String
          if ($xml -notmatch "<ExecutionTimeLimit>PT0S</ExecutionTimeLimit>" -or $xml -notmatch "<RestartOnFailure>") { throw "task: $xml" }
          tc start   # through the scheduled task, as SYSTEM
          tc status
          if (-not (healthy)) { tc logs 40; throw "the master does not answer" }
          # The supervisor starts the master again when it dies.
          $sup = [int](Get-Content "$svc/tisma-cloud.pid")
          $child = Get-CimInstance Win32_Process -Filter "ParentProcessId=$sup" | Where-Object { $_.CommandLine -notmatch '--local-node' } | Select-Object -First 1
          if (-not $child) { throw "no child of the supervisor $sup" }
          taskkill /PID $child.ProcessId /T /F | Out-Null
          Start-Sleep 2
          $back = $false
          for ($i = 0; $i -lt 40; $i++) { if (healthy) { $back = $true; break }; Start-Sleep 1 }
          tc logs 15
          if (-not $back) { throw "the master was not started again" }
          & $exe --home $svc check
          tc stop
          & $exe --home $svc status
          if ($LASTEXITCODE -ne 3) { throw "still running" }
          if (healthy) { throw "the master still answers" }
          tc autostart off
          tc firewall off
          if (Get-NetFirewallRule -DisplayName "Tisma Cloud" -ErrorAction SilentlyContinue) { throw "rule left" }
      - name: Tests on Windows (service and system)
        if: matrix.name == 'windows'
        run: |
          pip install ".[master,test]"
          pytest -q tests/test_system.py tests/test_manager.py
      - uses: actions/upload-artifact@v4
        with:
          name: tisma-cloud-${{ matrix.name }}
          path: |
            dist/${{ matrix.exe }}
            dist/tisma-engine
            dist/tisma-profiles
            dist/tisma-relay
            .env.example
            deploy/node.example.toml
          retention-days: 7
